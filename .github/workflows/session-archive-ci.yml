name: session-archive-ci

on:
  push:
    branches:
      - fix/session-transcript-archive-20260923

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - run: npm test
